name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      # Fails on a dependency with a known vulnerability (GitHub's and FriendsOfPHP's advisories).
      - name: Dependency audit
        run: composer audit --no-interaction

      - name: Tests
        run: vendor/bin/phpunit

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: JavaScript tests (the 'tinytank' browser helpers)
        run: |
          npm ci
          npm test

      # Fails on a high or critical advisory in the test tooling's packages (moderate: reported only).
      - name: JS dependency audit
        run: npm audit --audit-level=high
